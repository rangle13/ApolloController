<!-- ====================== PAGE 7: DEVICE LOG ====================== -->
<div id="page-log" class="page">
  <div class="ov-toolbar">
    <div class="ov-title">
      <span style="font-size:15px;font-weight:700;color:var(--amber);">Device Log</span>
      <span id="devlog-count" style="font-size:11px;color:var(--muted);">0 entries</span>
    </div>
    <div class="ov-actions" style="align-items:center;">
      <label style="font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px;"><input type="checkbox" id="devlog-pause" style="width:auto;" /> Pause</label>
      <button class="abtn abtn-ghost abtn-sm" id="devlog-collapse-btn">Collapse All</button>
      <button class="abtn abtn-ghost abtn-sm" id="devlog-download-btn">Download</button>
      <button class="abtn abtn-danger abtn-sm" id="devlog-clear-btn">Clear</button>
    </div>
  </div>
  <div id="devlog-list" class="log-area"></div>
</div>
