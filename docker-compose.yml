

services:
  apollo:
    build: .
    container_name: ApolloControllerDocker

    restart: unless-stopped
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-3000}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:$${PORT}/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
